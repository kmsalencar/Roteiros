<title>Setembro 2026 — Bucareste, Jônica, Praga</title>

<meta name="theme-color" content="#E9ECE6">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Roteiro">

<style>
:root{
  --ink:#17222C;
  --ink-soft:#5A6672;
  --paper:#E9ECE6;
  --card:#FDFDFB;
  --line:#CDD3CB;
  --ro:#6E2639;
  --io:#0B6E75;
  --cz:#9A6B21;
  --warn:#B4472A;
  --leg:var(--ro);
  --rail:14px;
  --serif:ui-serif,Georgia,"Iowan Old Style","Times New Roman",serif;
  --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif;
  --mono:ui-monospace,Menlo,"SF Mono",Consolas,monospace;
}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{
  background:var(--paper);
  color:var(--ink);
  font-family:var(--serif);
  font-size:17px;
  line-height:1.5;
  padding-bottom:56px;
  overflow-x:hidden;
}
.wrap{max-width:720px;margin:0 auto;padding:0 18px}

/* ---------- header ---------- */
header{
  position:sticky;top:0;z-index:40;
  background:var(--paper);
  border-bottom:1px solid var(--line);
}
.ribbon{height:4px;background:var(--leg);transition:background .35s ease}
.masthead{display:flex;align-items:baseline;justify-content:space-between;gap:12px;padding:11px 18px 8px;max-width:720px;margin:0 auto}
.masthead h1{
  font-family:var(--sans);
  font-weight:800;font-size:16px;letter-spacing:-.02em;
}
.masthead .legname{
  font-family:var(--mono);font-size:10px;
  text-transform:uppercase;letter-spacing:.14em;color:var(--leg);
  white-space:nowrap;transition:color .35s ease;
}
nav{overflow-x:auto;-webkit-overflow-scrolling:touch;scrollbar-width:none}
nav::-webkit-scrollbar{display:none}
.chips{display:flex;gap:6px;padding:0 18px 11px;width:max-content;min-width:100%}
.chip{
  font-family:var(--mono);
  background:transparent;border:1px solid var(--line);border-radius:2px;
  color:var(--ink-soft);cursor:pointer;
  padding:6px 9px 5px;text-align:center;line-height:1.15;
  transition:background .18s,color .18s,border-color .18s;
}
.chip b{display:block;font-size:14px;font-weight:600}
.chip span{display:block;font-size:9px;letter-spacing:.08em;text-transform:uppercase;opacity:.75}
.chip[data-leg="ro"]{border-bottom:2px solid var(--ro)}
.chip[data-leg="io"]{border-bottom:2px solid var(--io)}
.chip[data-leg="cz"]{border-bottom:2px solid var(--cz)}
.chip.on{background:var(--ink);color:var(--card);border-color:var(--ink)}
.chip.on span{opacity:.65}
.chip:focus-visible{outline:2px solid var(--leg);outline-offset:2px}

/* ---------- day ---------- */
.panel{display:none;padding-top:22px}
.panel.on{display:block;animation:rise .3s ease both}
@keyframes rise{from{opacity:0;transform:translateY(7px)}to{opacity:1;transform:none}}

.dayhead{margin-bottom:20px}
.dayhead .date{
  font-family:var(--mono);font-size:11px;letter-spacing:.16em;
  text-transform:uppercase;color:var(--leg);margin-bottom:5px;
}
.dayhead h2{
  font-family:var(--sans);
  font-weight:800;font-size:30px;line-height:1.06;letter-spacing:-.03em;
}
.dayhead p{font-size:15px;color:var(--ink-soft);margin-top:7px;font-style:italic}

/* ---------- rail ---------- */
.rail{position:relative;padding-left:calc(var(--rail) + 14px)}
.rail:before{
  content:"";position:absolute;left:var(--rail);top:7px;bottom:14px;
  width:1px;background:var(--line);
}
.ev{position:relative;padding:0 0 20px}
.ev:before{
  content:"";position:absolute;left:calc(-14px - var(--rail) + 11px);top:6px;
  width:7px;height:7px;border-radius:50%;
  background:var(--paper);border:1.5px solid var(--ink-soft);
}
.ev.ok:before{background:var(--leg);border-color:var(--leg)}
.ev.warn:before{background:var(--warn);border-color:var(--warn)}
.ev .t{
  font-family:var(--mono);font-size:11.5px;font-weight:600;
  letter-spacing:.03em;color:var(--ink-soft);display:block;margin-bottom:2px;
}
.ev h3{
  font-family:var(--sans);
  font-weight:600;font-size:17px;letter-spacing:-.01em;line-height:1.25;
}
.ev .where{font-size:14.5px;color:var(--ink-soft);margin-top:2px}
.ev .note{font-size:14.5px;margin-top:6px}
.ev .note.flag{color:var(--warn)}
.badge{
  display:inline-block;font-family:var(--mono);
  font-size:9px;letter-spacing:.1em;text-transform:uppercase;
  padding:2px 5px;border-radius:2px;margin-left:6px;vertical-align:2px;
  background:var(--leg);color:#fff;
}
.badge.open{background:transparent;color:var(--warn);border:1px solid var(--warn)}

.aside{
  background:var(--card);border-left:2px solid var(--leg);
  padding:12px 14px;margin:2px 0 22px;font-size:14.5px;
}
.aside b{font-family:var(--sans);font-weight:600;font-size:13px;display:block;margin-bottom:3px}

/* ---------- info ---------- */
.sec{margin-bottom:28px}
.sec h3{
  font-family:var(--mono);font-size:11px;letter-spacing:.16em;
  text-transform:uppercase;color:var(--ink-soft);
  padding-bottom:6px;border-bottom:1px solid var(--line);margin-bottom:12px;
}
.row{padding:10px 0;border-bottom:1px solid var(--line)}
.row:last-child{border-bottom:0}
.row .k{font-family:var(--sans);font-weight:600;font-size:15.5px}
.row .v{font-size:14.5px;color:var(--ink-soft);margin-top:2px}
.row .v a{color:var(--io)}
.row .k a{color:var(--io);text-decoration:none;border-bottom:1px solid var(--io)}
.todo{padding-left:20px;font-size:15px}
.todo li{margin-bottom:9px}
.todo li::marker{color:var(--warn)}

footer{padding:22px 0 8px;font-size:13px;color:var(--ink-soft);text-align:center;font-family:var(--mono);letter-spacing:.04em}

/* ---------- bottom pager ---------- */
.pager{
  position:fixed;bottom:0;left:0;right:0;z-index:40;
  display:flex;background:var(--card);border-top:1px solid var(--line);
}
.pager button{
  flex:1;background:none;border:0;padding:15px 8px;cursor:pointer;
  font-family:var(--mono);font-size:11px;letter-spacing:.08em;
  text-transform:uppercase;color:var(--ink);
}
.pager button:disabled{opacity:.28}
.pager button:focus-visible{outline:2px solid var(--leg);outline-offset:-3px}
.pager .mid{flex:0 0 auto;padding:15px 18px;border-left:1px solid var(--line);border-right:1px solid var(--line);font-weight:600}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>

/* ---------- render ---------- */
const chips = document.getElementById("chips");
const panels = document.getElementById("panels");

days.forEach((day,i)=>{
  const c=document.createElement("button");
  c.className="chip";c.dataset.leg=day.leg;c.dataset.i=i;
  c.innerHTML=`<b>${day.d}</b><span>${day.wd}</span>`;
  chips.appendChild(c);

  const p=document.createElement("section");
  p.className="panel";p.dataset.i=i;
  let html=`<div class="dayhead">
      <div class="date">${day.d} setembro · ${day.wd} · ${LEG[day.leg]}</div>
      <h2>${day.title}</h2>
      <p>${day.sub}</p>
    </div><div class="rail">`;
  day.items.forEach(ev=>{
    html+=`<div class="ev ${ev.s||""}">
      <span class="t">${ev.t}</span>
      <h3>${ev.h}${ev.b?`<span class="badge ${ev.b==="Confirmado"?"":"open"}">${ev.b}</span>`:""}</h3>
      ${ev.w?`<div class="where">${ev.w}</div>`:""}
      ${ev.n?`<div class="note${ev.flag?" flag":""}">${ev.n}</div>`:""}
    </div>`;
  });
  html+=`</div>`;
  if(day.aside) html+=`<div class="aside"><b>${day.aside.t}</b>${day.aside.b}</div>`;
  p.innerHTML=html;
  panels.appendChild(p);
});

const cInfo=document.createElement("button");
cInfo.className="chip";cInfo.dataset.i="info";
cInfo.innerHTML=`<b>i</b><span>info</span>`;
chips.appendChild(cInfo);

const pInfo=document.createElement("section");
pInfo.className="panel";pInfo.dataset.i="info";pInfo.innerHTML=info;
panels.appendChild(pInfo);

const allChips=[...document.querySelectorAll(".chip")];
const allPanels=[...document.querySelectorAll(".panel")];
const legname=document.getElementById("legname");
const prev=document.getElementById("prev"), next=document.getElementById("next");
let cur=0;

function show(i){
  cur=i;
  allChips.forEach((c,k)=>c.classList.toggle("on",k===i));
  allPanels.forEach((p,k)=>p.classList.toggle("on",k===i));
  const leg = days[i] ? days[i].leg : "cz";
  document.documentElement.style.setProperty("--leg",`var(--${leg})`);
  legname.textContent = days[i] ? LEG[leg] : "Referência";
  prev.disabled = i===0; next.disabled = i===allChips.length-1;
  allChips[i].scrollIntoView({block:"nearest",inline:"center",behavior:"smooth"});
  window.scrollTo({top:0,behavior:"instant"});
}
allChips.forEach((c,i)=>c.addEventListener("click",()=>show(i)));
prev.addEventListener("click",()=>show(Math.max(0,cur-1)));
next.addEventListener("click",()=>show(Math.min(allChips.length-1,cur+1)));
document.getElementById("toInfo").addEventListener("click",()=>show(allChips.length-1));
document.addEventListener("keydown",e=>{
  if(e.key==="ArrowRight") show(Math.min(allChips.length-1,cur+1));
  if(e.key==="ArrowLeft") show(Math.max(0,cur-1));
});
show(0);

if("serviceWorker" in navigator){
  window.addEventListener("load",()=>navigator.serviceWorker.register("./sw.js").catch(()=>{}));
}
</script>
